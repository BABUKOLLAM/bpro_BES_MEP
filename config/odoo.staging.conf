[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; db host/user/password intentionally NOT set here — the odoo docker image
; entrypoint injects them from the HOST/USER/PASSWORD environment variables
; CHANGE before first boot — separate from prod's master password
admin_passwd = CHANGE-ME-staging-master-password
proxy_mode = True

; single staging database, hidden database manager
list_db = False
db_name = bpro_staging
dbfilter = ^bpro_staging$

; Staging shares the VPS with production, which has very little RAM
; headroom (see docker-compose.staging.yml comment). workers = 0 runs
; Odoo in single-process threaded mode instead of forking worker
; processes — much lower baseline memory, at the cost of not handling
; concurrent long-requests as gracefully as prod. That's an acceptable
; trade for a low-traffic internal testing environment.
workers = 0
max_cron_threads = 1
limit_memory_hard = 1073741824
limit_memory_soft = 805306368
limit_time_cpu = 120
limit_time_real = 240

log_level = info
