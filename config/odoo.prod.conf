[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; db host/user/password intentionally NOT set here — the odoo docker image
; entrypoint injects them from the HOST/USER/PASSWORD environment variables
; CHANGE before first boot — protects database manager operations
admin_passwd = CHANGE-ME-master-password
proxy_mode = True

; single production database, hidden database manager
list_db = False
db_name = bpro
dbfilter = ^bpro$

; Sized for the current 22-addon platform (Manufacturing/Quality/Dashboard
; etc. materially raised base registry memory versus when this was a
; 7-module install) against an 8 GB VPS - see DEPLOY.md "What you need".
; Worst case (workers + cron) x limit_memory_hard = 3 x 2 GB = 6 GB,
; leaving ~2 GB headroom for the OS/Postgres/Caddy. Re-check this math if
; you resize the VPS or the addon count grows further.
workers = 2
max_cron_threads = 1
limit_memory_hard = 2147483648
limit_memory_soft = 1610612736
limit_time_cpu = 120
limit_time_real = 240

log_level = info
