[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; db host/user/password intentionally NOT set here — the odoo docker image
; entrypoint injects them from the HOST/USER/PASSWORD environment variables
; CHANGE before first boot — protects database manager operations
admin_passwd = CHANGE-ME-master-password
proxy_mode = True

; single production database, hidden database manager
list_db = False
db_name = bpro
dbfilter = ^bpro$

; multi-worker for production (rule of thumb: 2*CPU+1; 3 suits a 2-vCPU VPS)
workers = 3
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 120
limit_time_real = 240

log_level = info
