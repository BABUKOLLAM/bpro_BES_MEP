services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    image: odoo:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
      # Odoo's default is 2 seconds, meant to protect workers from idle
      # connections. That's far too short for a large (100MB+) file upload,
      # where gaps between TCP chunks routinely exceed 2s - the socket read
      # then raises "cannot read from timed out object" mid-request.
      ODOO_HTTP_SOCKET_TIMEOUT: "300"
    volumes:
      - odoo-data:/var/lib/odoo
      - ../config/odoo.prod.conf:/etc/odoo/odoo.conf:ro
      - ../addons:/mnt/extra-addons:ro
    command: odoo -c /etc/odoo/odoo.conf
    expose:
      - "8069"
      - "8072"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  odoo-data:
  caddy-data:
  caddy-config:
